name: "SinkNode"
manufacturer: "四川汇源"
model: "HYHJ-20250731"
labels: ["汇聚网关", "汇聚节点"]
description: "汇聚节点"

deviceResources: 
  - name: "eid"               
    isHidden: false                   
    description: "设备标识"
    properties:
      valueType: "String"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "238A08411011"    
  - name: "BatVolt"                
    isHidden: true                   
    description: "工作电压"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: "V"                      
      defaultValue: "0"    
  - name: "ElecCurr"                
    isHidden: true                   
    description: "工作电流"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: "A"                      
      defaultValue: "0"    
  - name: "Temp"                
    isHidden: true                   
    description: "工作温度"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: "℃"                      
      defaultValue: "0"                     
    isHidden: false
    description: "最新时间戳"
    properties:
      valueType: "Int64"                            
      readWrite: "R"                                
      units: "ns"
      defaultValue: "0"
  - name: "state"
    isHidden: false
    description: "运行状态"
    properties:
      valueType: "Uint8"
      readWrite: "R"
      units: "code"
      defaultValue: "0"
  - name: "period"
    isHidden: false
    description: "上报周期"
    properties:
      valueType: "Uint16"  
      readWrite: "R"
      units: "s"
      defaultValue: "30"
  - name: "AsyncReporting"
    isHidden: true
    description: "资源上传通道"
    properties:
      valueType: "Uint16"  
      readWrite: "R"
      units: ""
      defaultValue: "0"
  - name: "hBeat"
    isHidden: true
    description: "心跳通道"
    properties:
      valueType: "Uint16"  
      readWrite: "R"
      units: ""
      defaultValue: "0"
  - name: "cmdTimeParamQry"  
    isHidden: false
    description: "时间查询"
    properties:
      valueType: "Int8"    
      readWrite: "W"       
      units: ""
      defaultValue: "0"  
  - name: "cmdTimeParamSet"  
    isHidden: false
    description: "时间设置"
    properties:
      valueType: "Int8"    
      readWrite: "W"       
      units: ""
      defaultValue: "0"      
  - name: "cmdReSet" 
    isHidden: false
    description: "复位设置"
    properties:
      valueType: "Int8"    
      readWrite: "W"       
      units: ""
      defaultValue: "0"   
  - name: "cmdOperDataQ"  
    isHidden: false
    description: "工况查询"
    properties:
      valueType: "Int8"    
      readWrite: "W"       
      units: ""
      defaultValue: "0"    
deviceCommands:
  -
     name: "ResSinkNode"
     readWrite: "R"
     isHidden: false
     resourceOperations:
       - { deviceResource: "eid", defaultValue: "238A08411011" }
       - { deviceResource: "BatVolt", defaultValue: "0" }
       - { deviceResource: "ElecCurr", defaultValue: "0" }
       - { deviceResource: "Temp", defaultValue: "0" }
       - { deviceResource: "state", defaultValue: "0" }
