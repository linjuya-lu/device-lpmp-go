name: "AccessNode"
manufacturer: "四川汇源"
model: "HYJR-20250731"
labels: ["LoRa接入", "接入节点"]
description: "接入节点"

deviceResources:
  - name: "cmdTopoDiagQry"   
    isHidden: false
    description: "拓扑查询"
    properties:
      valueType: "Int8"    
      readWrite: "W"        
      units: ""            
      defaultValue: "0"     
  - name: "topoList"   # 资源：路由信息 <EID> <EID TYPE> <EID STA> <EID PARANT>
    isHidden: false
    description: "路由信息"
    properties:
      valueType: "Object"    
      readWrite: "R"        
      units: ""            
      defaultValue: "{}"     
  - name: "eid"               
    isHidden: false                   
    description: "设备标识"
    properties:
      valueType: "String"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "238A0841D828"   
  - name: "state"
    isHidden: false
    description: "运行状态"     
    properties:
      valueType: "Uint8"
      readWrite: "R"
      units: "code"
      defaultValue: "0" 
  - name: "hBeat"
    isHidden: true
    description: "心跳通道"
    properties:
      valueType: "Uint16"  
      readWrite: "R"
      units: ""
      defaultValue: "0"


