name: "Sink-Node-Profile"
manufacturer: "HY"
model: "sink-node"
labels:
  - "sinke-node"
description: "汇源汇聚节点"

deviceResources: 
  - name: "eid"               
    isHidden: false                   
    description: "设备唯一标识"
    properties:
      valueType: "String"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "238A0821BF34"    
  - name: "BatteryVoltage"                
    isHidden: false                   
    description: "网关工作电压"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"    
  - name: "ElectricCurrent"                
    isHidden: false                   
    description: "网关工作电流"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"    
  - name: "Temperature"                
    isHidden: false                   
    description: "网关工作温度"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "10minAvgWindSpeed"                
    isHidden: false                   
    description: "平均风速"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "10minAvgWindDirection"                
    isHidden: false                   
    description: "平均风向"
    properties:
      valueType: "Int16"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "MaxWindSpeed"                
    isHidden: false                   
    description: "最大风速"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "Temperature1"                
    isHidden: false                   
    description: "环境温度"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "Humidity1"                
    isHidden: false                   
    description: "环境湿度"
    properties:
      valueType: "Uint16"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "Pressure"                
    isHidden: false                  
    description: "大气气压"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "Rainfall10min"                
    isHidden: false                   
    description: "雨量"
    properties:
      valueType: "Float32"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "SolarRadiation"                
    isHidden: false                   
    description: "光照强度"
    properties:
      valueType: "Uint16"            
      readWrite: "R"                 
      units: ""                      
      defaultValue: "0"   
  - name: "lastDataTimestamp"                       # 上次收到数据的时间戳
    isHidden: false
    description: "上次收到数据的系统时间(Unix 纳秒）"
    properties:
      valueType: "Int64"                            # 64 位整数，纳秒级
      readWrite: "R"                                
      units: "ns"
      defaultValue: "0"
  - name: "state"
    isHidden: false
    description: "传感器运行状态(0=正常,1=故障)"
    properties:
      valueType: "Uint8"
      readWrite: "R"
      units: "code"
      defaultValue: "0"
  - name: "period"
    isHidden: false
    description: "上报周期（秒）"
    properties:
      valueType: "Uint32"  
      readWrite: "R"
      units: "s"
      defaultValue: "0"

deviceCommands:
